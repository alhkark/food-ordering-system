[versions]
lombok = "1.18.38"
spring-boot = "4.0.1"
spring-dependency-management = "1.1.7"
junit = "6.0.2"
spotless = "8.1.0"
google-java-format="1.33.0"
mapstruct="1.6.3"

[libraries]
#plugins
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spring-boot-plugin-gradle = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin-gradle = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

#dependencies
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }