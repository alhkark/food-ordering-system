[versions]
lombok = "1.18.38"
spring-boot = "4.0.1"
confluent = "8.0.3"
spring-dependency-management = "1.1.7"
junit = "6.0.2"
spotless = "8.1.0"
google-java-format="1.33.0"
mapstruct="1.6.3"
mockito="5.21.0"
apache-avro="1.12.1"
apache-avro-gradle-plugin="1.2.0"
test-container-bom="1.21.4"
flyway-postgres="12.8.1"
spring-ai="2.0.0"

[libraries]
#plugins
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spring-boot-plugin-gradle = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin-gradle = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

#dependencies
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging", version.ref = "spring-boot" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
kafka-avro-ser = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }
apache-avro = { module = "org.apache.avro:avro", version.ref = "apache-avro" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway-postgres"}
spring-ai-ollama = { module = "org.springframework.ai:spring-ai-starter-model-ollama"}

#bom
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai"}
test-container-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "test-container-bom" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
apache-avro-gradle-plugin = { id = "io.github.martinsjavacode.avro-gradle-plugin", version.ref = "apache-avro-gradle-plugin" }