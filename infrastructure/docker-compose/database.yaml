configs:
  pgadmin-servers:
    file: ./pgadmin/servers.json

services:
  postgres:
    image: postgres:18-alpine
    container_name: food-ordering-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgAdmin:
    image: dpage/pgadmin4:9.8
    container_name: food-ordering-pgadmin
    user: root
    entrypoint: >
      /bin/sh -c "
      install -m 600 -o 5050 -g 5050 /pgpass-src/pgpass /var/lib/pgadmin/.pgpass &&
      exec /entrypoint.sh
      "
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASSFILE: /var/lib/pgadmin/.pgpass
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
    volumes:
      - ./pgadmin/pgpass:/pgpass-src/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: