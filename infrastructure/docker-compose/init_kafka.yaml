services:
  init-kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-latest}
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # block until kafka is reachable
      kafka-topics --bootstrap-server broker-1:19092 --list

      echo -e 'Deleting kafka topics'
      kafka-topics --bootstrap-server broker-1:19092 --topic payment-request --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic payment-request.DLT --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic payment-response --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic payment-response.DLT --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic restaurant-approval-request --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic restaurant-approval-request.DLT --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic restaurant-approval-response --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic restaurant-approval-response.DLT --delete --if-exists
      kafka-topics --bootstrap-server broker-1:19092 --topic customer --delete --if-exists

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic payment-request --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic payment-request.DLT  --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic payment-response --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic payment-response.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic restaurant-approval-request --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic restaurant-approval-request.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic restaurant-approval-response --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic restaurant-approval-response.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic customer --replication-factor 3 --partitions 3
      
      echo -e 'Creating schema-registry topics'
      kafka-topics --bootstrap-server broker-1:19092 --create --if-not-exists --topic _schemas --replication-factor 3 --partitions 1 --config cleanup.policy=compact

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server broker-1:19092 --list
      "
    networks:
      - ${GLOBAL_NETWORK:-kafka}