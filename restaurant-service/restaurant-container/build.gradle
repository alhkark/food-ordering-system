plugins {
    id 'common-library-convention'
    id 'logging-library-convention'
    id 'spring-library-convention'
    id 'test-container-convention'
}

dependencies {
    implementation project(':restaurant-service:restaurant-domain:restaurant-domain-core')
    implementation project(':restaurant-service:restaurant-domain:restaurant-application-service')
    implementation project(':restaurant-service:restaurant-data-access')
    implementation project(':restaurant-service:restaurant-messaging')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation libs.flyway.postgres
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
}

bootBuildImage {
    imageName = "${project.group}/payment.service:${project.version}"
//    environment = ["BP_JVM_VERSION": "21", "BP_JVM_HEAD_ROOM": "0"]
}