plugins {
    id 'common-library-convention'
    id 'logging-library-convention'
    id 'spring-library-convention'
}

dependencies {
    implementation project(':payment-service:payment-domain:payment-application-service')
    implementation project(':common:common-mapper')
    implementation project(':common:common-data-access-archive')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor
}