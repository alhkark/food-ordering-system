server:
  port: 8182

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.food.ordering.system: DEBUG
    org.flywaydb: DEBUG
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
    org.apache.kafka.clients.consumer: ERROR
    org.apache.kafka.clients.producer: ERROR

payment-service:
  payment-request-topic-name: debezium_order_payment_outbox.order.payment_outbox
  payment-response-topic-name: debezium_payment_order_outbox.payment.order_outbox
archive:
  jdbc-batch-size: 30

spring:
  main:
    keep-alive: true
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=payment&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payment
    default-schema: payment_flyway
    baseline-on-migrate: false
    table: flyway_schema_history

kafka-config:
  bootstrap-servers: localhost:29092, localhost:39092, localhost:49092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 3

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  payment-request-consumer-group-id: payment-request-consumer
  payment-request-dlt-consumer-group-id: payment-request-dlt-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: false
  auto-startup: true
  concurrency-level: 3
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150
  retry-interval-ms: 2000
  retry-max-attempts: 3
  dlt-suffix: .DLT