plugins {
    id 'common-library-convention'
    id 'logging-library-convention'
    id 'spring-library-convention'
    id 'test-container-convention'
}

dependencies {
    implementation project(':order-service:order-domain:order-domain-core')
    implementation project(':order-service:order-domain:order-application-service')
    implementation project(':order-service:order-data-access')
    implementation project(':order-service:order-messaging')
    implementation project(':order-service:order-application')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation libs.flyway.postgres
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('bootJar') { enabled = true }
tasks.named('jar') { enabled = false }

bootBuildImage {
    enabled = true
    imageName = "${project.group}/order.service:${project.version}"
//    environment = ["BP_JVM_VERSION": "21", "BP_JVM_HEAD_ROOM": "0"]
}