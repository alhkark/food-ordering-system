databaseChangeLog:
  - changeSet:
      id: 1-create-order-schema
      author: food-ordering-system
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS "order"

  - changeSet:
      id: 2-create-uuid-ossp-extension
      author: food-ordering-system
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp"

  - changeSet:
      id: 3-create-order-status-enum
      author: food-ordering-system
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: SELECT COUNT(*) FROM pg_type WHERE typname = 'order_status'
      changes:
        - sql:
            sql: CREATE TYPE "order".order_status AS ENUM ('PENDING', 'PAID', 'APPROVED', 'CANCELLED', 'CANCELLING')

  - changeSet:
      id: 4-create-orders-table
      author: food-ordering-system
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE TABLE "order".orders (
                id UUID NOT NULL,
                customer_id UUID NOT NULL,
                restaurant_id UUID NOT NULL,
                tracking_id UUID NOT NULL,
                price numeric(10, 2) NOT NULL,
                order_status "order".order_status NOT NULL,
                failure_messages VARCHAR,
                CONSTRAINT orders_pkey PRIMARY KEY (id)
              )

  - changeSet:
      id: 5-create-order-items-table
      author: food-ordering-system
      changes:
        - createTable:
            schemaName: order
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: order_items_pkey
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: order_items_pkey
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: sub_total
                  type: numeric(10,2)
                  constraints:
                    nullable: false

  - changeSet:
      id: 6-add-order-items-foreign-key
      author: food-ordering-system
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: order
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableSchemaName: order
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: FK_ORDER_ITEMS_ORDER_ID
            onDelete: CASCADE

  - changeSet:
      id: 7-create-order-address-table
      author: food-ordering-system
      changes:
        - createTable:
            schemaName: order
            tableName: order_address
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: order_address_pkey
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    primaryKey: true
                    primaryKeyName: order_address_pkey
              - column:
                  name: street
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: postal_code
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: varchar
                  constraints:
                    nullable: false

  - changeSet:
      id: 8-add-order-address-foreign-key
      author: food-ordering-system
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: order
            baseTableName: order_address
            baseColumnNames: order_id
            referencedTableSchemaName: order
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: FK_ORDER_ADDRESS_ORDER_ID
            onDelete: CASCADE
